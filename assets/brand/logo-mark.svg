<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Emberling mark">
  <!--
    Emberling mark — "one bright dot in orbit".
    The agent is the dot; the ring is its reach (tools, web, automations);
    the satellite bead is a subagent or trigger passing by.
    Geometry: dot r13.5 @ (32,35); ring ellipse rx28.5 ry10.5 rotated -16deg;
    ring passes BEHIND the dot (back arc occluded), front arc drawn over it.
  -->
  <defs>
    <radialGradient id="emDot" cx="0.35" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ff8a4d"/>
      <stop offset="0.55" stop-color="#f54e00"/>
      <stop offset="1" stop-color="#cf4100"/>
    </radialGradient>
  </defs>
  <ellipse cx="32" cy="32.5" rx="28.5" ry="10.5" transform="rotate(-16 32 32.5)" fill="none" stroke="#f0f0f0" stroke-opacity="0.92" stroke-width="4.5"/>
  <circle cx="32" cy="35" r="13.5" fill="url(#emDot)"/>
  <path d="M59.4 24.65 A28.5 10.5 -16 0 1 4.6 40.35" fill="none" stroke="#f0f0f0" stroke-opacity="0.92" stroke-width="4.5"/>
  <circle cx="52.8" cy="20.3" r="3.4" fill="#ff6a24"/>
</svg>
