<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Tempo, the automations bot">
  <!--
    TEMPO — schedules & automations bot. Alarm bells on top, a clock badge on
    the shoulder, one eye mid-wink. Body: yellow.
  -->
  <defs>
    <radialGradient id="tempoBody" cx="0.33" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#f8d194"/>
      <stop offset="0.55" stop-color="#f1b467"/>
      <stop offset="1" stop-color="#d19041"/>
    </radialGradient>
  </defs>
  <ellipse cx="48" cy="88" rx="20" ry="4.5" fill="#000" opacity="0.28"/>
  <circle cx="48" cy="52" r="30" fill="url(#tempoBody)"/>
  <!-- alarm bells -->
  <circle cx="35" cy="16.5" r="5.5" fill="#c98a3f"/>
  <circle cx="61" cy="16.5" r="5.5" fill="#c98a3f"/>
  <path d="M36.5 21 L38 24" stroke="#c98a3f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M59.5 21 L58 24" stroke="#c98a3f" stroke-width="2.4" stroke-linecap="round"/>
  <!-- clock badge -->
  <circle cx="66" cy="28" r="6.5" fill="#141414"/>
  <path d="M66 28 V24.8 M66 28 L68.6 29.6" fill="none" stroke="#f1b467" stroke-width="1.6" stroke-linecap="round"/>
  <!-- face: one open eye, one wink -->
  <ellipse cx="38.5" cy="46" rx="2.8" ry="3.8" fill="#141414"/>
  <circle cx="37.6" cy="44.6" r="1" fill="#fff" opacity="0.85"/>
  <path d="M53.5 46.5 Q57.5 49.5 61.5 46.5" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round"/>
  <ellipse cx="34" cy="55" rx="4.2" ry="2.6" fill="#e0566f" opacity="0.35"/>
  <ellipse cx="62" cy="55" rx="4.2" ry="2.6" fill="#e0566f" opacity="0.35"/>
  <path d="M43 56.5 Q48 62 53 56.5" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round"/>
</svg>
