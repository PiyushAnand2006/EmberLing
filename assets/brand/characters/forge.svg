<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Forge, the coding bot">
  <!--
    FORGE — terminal & code bot. Terminal visor with a prompt ("> _") for a
    face; cheeks and smile sit just below the visor. Body: green.
  -->
  <defs>
    <radialGradient id="forgeBody" cx="0.33" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#6fc48f"/>
      <stop offset="0.55" stop-color="#3fa266"/>
      <stop offset="1" stop-color="#2c7f4c"/>
    </radialGradient>
  </defs>
  <ellipse cx="48" cy="88" rx="20" ry="4.5" fill="#000" opacity="0.28"/>
  <circle cx="48" cy="52" r="30" fill="url(#forgeBody)"/>
  <!-- terminal visor -->
  <rect x="26" y="38" width="44" height="17" rx="8.5" fill="#0e1f16" stroke="#141414" stroke-width="1.5"/>
  <path d="M34 43 L40 46.5 L34 50" fill="none" stroke="#8fe6b0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 51 H52" stroke="#8fe6b0" stroke-width="2.6" stroke-linecap="round"/>
  <!-- face -->
  <ellipse cx="34" cy="57.5" rx="4.2" ry="2.6" fill="#e0566f" opacity="0.35"/>
  <ellipse cx="62" cy="57.5" rx="4.2" ry="2.6" fill="#e0566f" opacity="0.35"/>
  <path d="M44 62 Q48 65 52 62" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round"/>
</svg>
